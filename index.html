
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Grounded Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafaf7;--sf:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e2e1da;--ac:#2f6f4f;--ok:#2f6f4f;--wn:#b45309;--us:#e4eee7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--sf:#202220;--tx:#ecebe6;--mu:#a09f98;--bd:#34362f;--ac:#6fc296;--ok:#6fc296;--wn:#f0a95a;--us:#27362d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--sf:#202220;--tx:#ecebe6;--mu:#a09f98;--bd:#34362f;--ac:#6fc296;--ok:#6fc296;--wn:#f0a95a;--us:#27362d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;margin:0}p.sub{margin:2px 0 0;color:var(--mu);font-size:14px}
details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
textarea,input[type=text]{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:140px;margin-top:8px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{background:var(--ac);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}button:disabled{opacity:.5}
#log{display:flex;flex-direction:column;gap:10px;min-height:120px}
.m{padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{background:var(--us);align-self:flex-end;max-width:90%}
.ev{margin-top:8px;font-size:13px;color:var(--mu);border-top:1px dashed var(--bd);padding-top:6px}
.ev div{margin-top:4px}.ok{color:var(--ok);font-weight:600}.wn{color:var(--wn);font-weight:600}
.badge{display:block;margin-top:6px;font-size:13px}
#bar{display:flex;gap:8px}#note{color:var(--wn);font-size:14px}
</style></head><body><main>
<div><h1>🔎 Grounded Chat</h1>
<p class="sub">Answers only from sources you provide. Every claim must carry a quote, and the app checks each quote against your text.</p></div>
<details open><summary>Your sources</summary>
<textarea id="src" placeholder="Paste trusted text here: docs, policies, articles, data…"></textarea>
<div class="row"><input id="file" type="file" accept=".txt,.md,.csv,.json" multiple hidden>
<button class="ghost" id="up">Add file</button><button class="ghost" id="clr">Clear</button>
<span id="cnt" class="sub"></span></div></details>
<div id="note" hidden>Ask-Claude access isn’t available in this view, so chat can’t run here.</div>
<div id="log" aria-live="polite"></div>
<div id="bar"><input type="text" id="q" placeholder="Ask about your sources…"><button id="go">Ask</button></div>
</main>
<script>
const $=id=>document.getElementById(id);let sample=null,busy=false;const hist=[];
const norm=s=>s.toLowerCase().replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\s+/g,' ').trim();
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function cnt(){$('cnt').textContent=$('src').value.length.toLocaleString()+' characters'}
$('src').addEventListener('input',cnt);cnt();
$('clr').onclick=()=>{$('src').value='';cnt()};
$('up').onclick=()=>$('file').click();
$('file').onchange=async e=>{for(const f of e.target.files){const t=await f.text();$('src').value+=(($('src').value?'\n\n':'')+'--- '+f.name+' ---\n'+t)}cnt();e.target.value=''};
try{window.claude&&claude.use('sample').then(s=>{sample=s;if(!s)$('note').hidden=false}).catch(()=>{$('note').hidden=false})}catch(e){$('note').hidden=false}
function bot(res,txt){const m=el('div','m',txt);$('log').appendChild(m);return m}
async function ask(){
  const q=$('q').value.trim();if(!q||busy)return;
  const src=$('src').value.trim();
  $('log').appendChild(el('div','m u',q));$('q').value='';
  if(!src){bot(0,'Add your sources first. I only answer from them.');return}
  if(!sample){bot(0,'Chat isn’t available in this view.');return}
  busy=true;$('go').disabled=true;const wait=bot(0,'Checking your sources…');
  const recent=hist.slice(-6).map(h=>h.r+': '+h.t).join('\n');
  const prompt='You are a strict, source-grounded assistant. Use ONLY the SOURCES below, never outside knowledge or guesses. '+
  'Return ONLY JSON: {"found":boolean,"answer":string,"quotes":[string]}. '+
  '"quotes" must be exact verbatim excerpts (each under 25 words) copied character for character from SOURCES, together supporting every claim in "answer". '+
  'If SOURCES do not fully answer the question, set found=false, quotes=[], and say what is missing in "answer". Do not fill gaps.\n\nSOURCES:\n'+src+
  '\n\nRECENT CHAT:\n'+recent+'\n\nQUESTION: '+q;
  try{
    const r=await sample.json(prompt,{cache:false,modelTier:'complex'});
    wait.remove();
    const m=bot(0,String(r.answer||''));
    const ns=norm(src),qs=Array.isArray(r.quotes)?r.quotes:[];
    if(r.found){
      const checks=qs.map(x=>({x,ok:ns.includes(norm(String(x)))}));
      const allOk=checks.length>0&&checks.every(c=>c.ok);
      m.appendChild(el('span','badge '+(allOk?'ok':'wn'),allOk?'✓ Verified: every quote appears in your sources':'⚠ Unverified: treat this answer as unconfirmed'));
      if(checks.length){const ev=el('div','ev');checks.forEach(c=>{const d=el('div','',(c.ok?'✓ ':'⚠ ')+'“'+c.x+'”');ev.appendChild(d)});m.appendChild(ev)}
    }else m.appendChild(el('span','badge wn','Not found in your sources, so no answer is given.'));
    hist.push({r:'User',t:q},{r:'Assistant',t:String(r.answer||'')});
  }catch(e){wait.remove();bot(0,'Couldn’t get an answer ('+(e&&e.code||'error')+'). Try again.')}
  busy=false;$('go').disabled=false;$('q').focus();
}
$('go').onclick=ask;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
</script></body></html>
